[project]
name = "stock-return-prediction"
version = "0.1.0"
description = "Can machine learning predict tomorrow from past prices? A century of daily US returns"
requires-python = ">=3.11"
dependencies = [
    'numpy==2.1.3',
    'pandas==2.2.3',
    'scikit-learn==1.5.2',
    'matplotlib==3.9.4'
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
