[project]
name = "stock-return-prediction"
version = "0.1.0"
description = "Research code for Stock-Return-Prediction"
requires-python = ">=3.11"
dependencies = [
    'numpy>=1.24',
    'pandas>=2.0',
    'scipy>=1.11',
    'scikit-learn>=1.3',
    'xgboost>=2.0',
    'lightgbm>=4.0',
    'ta>=0.11',
    'yfinance>=0.2.28',
    'matplotlib>=3.7',
    'seaborn>=0.12',
    'pytest>=7.4'
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
